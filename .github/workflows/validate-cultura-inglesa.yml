name: Validate Cultura Inglesa Front-End

on:
  pull_request:
    branches: [main]
    paths:
      - 'cultura-inglesa/**'
      - '.github/workflows/deploy-secret-acai-pages.yml'
      - '.github/workflows/validate-cultura-inglesa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check cultura-inglesa/js/main.js
          node --check cultura-inglesa/js/map-config.js
      - name: Validate local assets and in-page links
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'cultura-inglesa';
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          const ids = [...html.matchAll(/\\bid="([^"]+)"/g)].map(match => match[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate IDs: ' + [...new Set(duplicates)].join(', '));
          const refs = [...html.matchAll(/\\b(?:href|src|srcset)="([^"]+)"/g)].map(match => match[1]);
          const anchors = refs.filter(ref => ref.startsWith('#')).map(ref => ref.slice(1));
          const missingAnchors = anchors.filter(anchor => anchor && !ids.includes(anchor));
          if (missingAnchors.length) throw new Error('Broken in-page links: ' + missingAnchors.join(', '));
          const local = refs.filter(ref => !/^(https?:|tel:|mailto:|#|data:)/.test(ref));
          const missing = local.filter(ref => !fs.existsSync(path.join(root, ref)));
          if (missing.length) throw new Error('Missing local files: ' + missing.join(', '));
          console.log('OK: unique IDs, ' + anchors.length + ' in-page links, ' + local.length + ' local asset references.');
          NODE
      - name: Verify Vite projects still build
        run: |
          npm --prefix secret-acai install --no-audit --no-fund
          npm --prefix secret-acai run build
          npm --prefix ledgerflow install --no-audit --no-fund
          npm --prefix ledgerflow run build
