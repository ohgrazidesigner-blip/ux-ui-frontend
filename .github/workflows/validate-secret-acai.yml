name: Audit Secret Açaí Front-End

on:
  pull_request:
    branches: [main]
    paths:
      - 'secret-acai/**'
      - '.github/scripts/secret-acai-browser.cjs'
      - '.github/workflows/validate-secret-acai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Secret Açaí and LedgerFlow (regression safeguard)
        run: |
          npm --prefix secret-acai install --no-audit --no-fund
          npm --prefix secret-acai run build
          npm --prefix ledgerflow install --no-audit --no-fund
          npm --prefix ledgerflow run build
      - name: Install browser tests
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Test screenshots, keyboard navigation and local simulated flows
        shell: bash
        run: |
          npm --prefix secret-acai run preview -- --host 127.0.0.1 --port 8766 --strictPort > /tmp/secret-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node .github/scripts/secret-acai-browser.cjs
      - name: Upload audit screenshots and accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-acai-audit
          path: secret-audit-artifacts/
          if-no-files-found: ignore
          retention-days: 14
