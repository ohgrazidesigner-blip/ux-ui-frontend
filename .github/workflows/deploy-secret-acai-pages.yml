name: Publish Secret Acai to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'secret-acai/**'
      - '.github/workflows/deploy-secret-acai-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: secret-acai-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: secret-acai
        run: npm install --no-audit --no-fund
      - name: Build Secret Acai
        working-directory: secret-acai
        run: npm run build
      - name: Prepare site
        run: |
          mkdir -p public/secret-acai
          cp -R secret-acai/dist/. public/secret-acai/
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=./secret-acai/"><title>Secret Açaí</title></head>
            <body><p><a href="./secret-acai/">Abrir Secret Açaí</a></p></body>
          </html>
          EOF
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
