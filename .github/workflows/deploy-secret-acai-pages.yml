name: Publish Front-End Portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'secret-acai/**'
      - 'ledgerflow/**'
      - '.github/workflows/deploy-secret-acai-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-portfolio-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for both apps
        run: |
          npm --prefix secret-acai install --no-audit --no-fund
          npm --prefix ledgerflow install --no-audit --no-fund
      - name: Build both apps
        run: |
          npm --prefix secret-acai run build
          npm --prefix ledgerflow run build
      - name: Assemble GitHub Pages site
        run: |
          mkdir -p public/secret-acai public/ledgerflow
          cp -R secret-acai/dist/. public/secret-acai/
          cp -R ledgerflow/dist/. public/ledgerflow/
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Front-End Portfolio</title>
            <style>body{font:16px system-ui;background:#f8fafc;color:#0f172a;max-width:750px;margin:80px auto;padding:20px}a{display:block;padding:24px;background:white;border:1px solid #e2e8f0;margin:20px 0;border-radius:12px;color:#2563eb;text-decoration:none;font-weight:600}</style>
          </head><body><h1>Front-End Portfolio</h1><p>Selecione um projeto para visualizar a demonstração.</p>
          <a href="./secret-acai/">Secret Açaí — Sales &amp; Operations</a>
          <a href="./ledgerflow/">LedgerFlow — Accounting Operations</a>
          </body></html>
          EOF
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
