name: Publish Front-End Portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'cultura-inglesa/**'
      - 'secret-acai/**'
      - 'ledgerflow/**'
      - 'showcase/**'
      - '.github/workflows/deploy-secret-acai-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-portfolio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for both apps
        run: |
          npm --prefix secret-acai install --no-audit --no-fund
          npm --prefix ledgerflow install --no-audit --no-fund
      - name: Build both apps
        run: |
          npm --prefix secret-acai run build
          npm --prefix ledgerflow run build
      - name: Assemble GitHub Pages site
        run: |
          mkdir -p public/cultura-inglesa public/secret-acai public/ledgerflow
          cp -R secret-acai/dist/. public/secret-acai/
          cp -R ledgerflow/dist/. public/ledgerflow/
          cp -R cultura-inglesa/. public/cultura-inglesa/
          cp -R showcase/. public/
          touch public/.nojekyll
      - name: Verify all three projects before publishing
        run: |
          test -s public/index.html
          test -s public/styles.css
          test -s public/script.js
          test -s public/favicon.svg
          for image in cultura-inglesa secret-acai ledgerflow; do
            test -s "public/assets/$image-desktop.jpg"
            test -s "public/assets/$image-mobile.jpg"
          done
          test -s public/cultura-inglesa/index.html
          test -s public/cultura-inglesa/css/styles.css
          test -s public/cultura-inglesa/js/main.js
          test -s public/cultura-inglesa/assets/hero-portrait.png
          node --check public/script.js
          node --check public/cultura-inglesa/js/main.js
          node --check public/cultura-inglesa/js/map-config.js
          test -s public/secret-acai/index.html
          test -s public/ledgerflow/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
